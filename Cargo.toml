[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ipc",
    "crates/proto-http",
    "crates/proto-hls",
    "crates/proto-dash",
    "crates/proto-external",
    "crates/proto-ytdlp",
    "crates/ffmpeg",
    "crates/winutil",
    "crates/i18n",
    "crates/testserver",
    "apps/cli",
    "apps/core-service",
    "apps/nmhost",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/RiasJ1Dar/downloader"

[workspace.dependencies]
downloader-core = { path = "crates/core" }
downloader-testserver = { path = "crates/testserver" }
downloader-proto-http = { path = "crates/proto-http" }
downloader-proto-hls = { path = "crates/proto-hls" }
downloader-proto-dash = { path = "crates/proto-dash" }
downloader-proto-external = { path = "crates/proto-external" }
downloader-proto-ytdlp = { path = "crates/proto-ytdlp" }
downloader-ffmpeg = { path = "crates/ffmpeg" }
downloader-winutil = { path = "crates/winutil" }
downloader-ipc = { path = "crates/ipc" }
downloader-i18n = { path = "crates/i18n" }

fluent-bundle = "0.15"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# мережа рушія
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "socks"] }
bytes = "1"
futures-util = "0.3"
m3u8-rs = "6"
aes = "0.8"
cbc = "0.1"
# лише розбір MPD; fetch/ffmpeg/reqwest 0.13 не тягнемо (у нас reqwest 0.12)
dash-mpd = { version = "0.20", default-features = false }

# перевірка цілісності в тестах
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
rand = "0.9"

# Windows-специфіка winutil (BSL-1.0, permissive як MIT)
clipboard-win = "5"
# буфер обміну на Linux/macOS (MIT/Apache-2.0)
arboard = "3"
# вільне місце на диску, Windows і Unix (MIT/Apache-2.0)
fs2 = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
