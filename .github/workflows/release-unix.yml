name: release-unix

# Linux + macOS experimental prerelease.
# Trigger: tags v*-unix (e.g. v0.1.0-unix) or manual dispatch.
# Does NOT replace Windows release.yml (MSI on tags v*).

on:
  push:
    tags:
      - 'v*-unix'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.1.0) — tag will be v{version}-unix if creating release'
        required: false
        default: '0.1.2'

permissions:
  contents: write

env:
  VERSION: '0.1.2'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            # v0.1.0-unix → 0.1.0
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
            VER="${VER%-unix}"
          else
            VER="${{ inputs.version || '0.1.2' }}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Using VERSION=$VER"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install tray + packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev pkg-config \
            dpkg-dev

      - name: Build tarball + deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ./packaging/build-unix-tarball.sh
          ./packaging/build-deb.sh
          ls -lh target/unix/


      - name: Smoke (Linux binaries, no GUI)
        run: |
          set -euo pipefail
          ./packaging/ci-smoke-unix.sh "$PWD/target/release"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unix-linux-x64
          path: |
            target/unix/Downloader-*-linux-x64.tar.gz
            target/unix/Downloader-*-linux-x64.tar.gz.sha256
            target/unix/Downloader-*-linux-x64.deb
            target/unix/Downloader-*-linux-x64.deb.sha256
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
            VER="${VER%-unix}"
          else
            VER="${{ inputs.version || '0.1.2' }}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Using VERSION=$VER"
          echo "Host arch: $(uname -m)"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          targets: "x86_64-apple-darwin"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build macOS arm64 tarball (native)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # macos-latest is Apple Silicon → Downloader-*-macos-arm64.tar.gz
          ./packaging/build-unix-tarball.sh
          ls -lh target/unix/Downloader-*-macos-*.tar.gz*

      - name: Build macOS x64 tarball (cross)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ROOT="$PWD"
          VER="${VERSION}"
          OUT="$ROOT/target/unix"
          STAGE="$OUT/stage-macos-x64"
          RID="osx-x64"
          ARCH_TAG="x64"
          TARBALL_NAME="Downloader-${VER}-macos-${ARCH_TAG}.tar.gz"

          echo "==> cross-build Rust x86_64-apple-darwin"
          cargo build --release --target x86_64-apple-darwin \
            -p downloader-cli \
            -p downloader-core-service \
            -p downloader-nmhost

          rm -rf "$STAGE"
          mkdir -p "$STAGE/bin" "$STAGE/share/Downloader" \
                   "$STAGE/packaging/systemd" "$STAGE/packaging/macos"

          REL="$ROOT/target/x86_64-apple-darwin/release"
          install -m 755 "$REL/downloader-core" "$STAGE/bin/downloader-core"
          install -m 755 "$REL/dl" "$STAGE/bin/dl"
          install -m 755 "$REL/dl" "$STAGE/bin/downloader-cli"
          install -m 755 "$REL/downloader-nmhost" "$STAGE/bin/downloader-nmhost"

          echo "==> dotnet publish UI $RID"
          dotnet publish "$ROOT/apps/ui/Downloader.Ui.csproj" \
            -c Release -r "$RID" --self-contained true \
            -o "$STAGE/share/Downloader/ui"
          chmod +x "$STAGE/share/Downloader/ui/Downloader.Ui" || true
          printf '%s\n' '#!/usr/bin/env bash' \
            'ROOT_DIR="$(cd "$(dirname "$0")/.." && pwd)"' \
            'exec "$ROOT_DIR/share/Downloader/ui/Downloader.Ui" "$@"' \
            > "$STAGE/bin/Downloader.Ui"
          chmod +x "$STAGE/bin/Downloader.Ui"

          install -m 755 "$ROOT/packaging/install-unix.sh" "$STAGE/install-unix.sh"
          cp "$ROOT/packaging/systemd/downloader-core.service" "$STAGE/packaging/systemd/"
          cp "$ROOT/packaging/macos/com.riasj1dar.downloader-core.plist" "$STAGE/packaging/macos/"
          printf '%s\n' \
            "Downloader ${VER} - macos-x64 (experimental, UNSIGNED)" \
            "Install: ./install-unix.sh --user" \
            "Gatekeeper will warn - packages are not notarized." \
            > "$STAGE/README-UNIX.txt"

          TMP="$OUT/_pack-x64"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          cp -a "$STAGE" "$TMP/Downloader-${VER}-macos-${ARCH_TAG}"
          tar -C "$TMP" -czf "$OUT/$TARBALL_NAME" "Downloader-${VER}-macos-${ARCH_TAG}"
          rm -rf "$TMP"
          (cd "$OUT" && shasum -a 256 "$TARBALL_NAME" > "${TARBALL_NAME}.sha256")
          ls -lh "$OUT/$TARBALL_NAME"*


      - name: Smoke (macOS arm64 native binaries, no GUI)
        run: |
          set -euo pipefail
          ./packaging/ci-smoke-unix.sh "$PWD/target/release"

      - name: Smoke (macOS x64 cross binaries — version/help only)
        run: |
          set -euo pipefail
          REL="$PWD/target/x86_64-apple-darwin/release"
          # Rosetta may be required on arm64 runners; skip (warn) if unexecutable.
          if ! "$REL/dl" -V >/dev/null 2>&1; then
            echo "WARN: cannot execute x64 binaries on this runner — skipping x64 smoke"
            file "$REL/dl" || true
            exit 0
          fi
          "$REL/downloader-core" -V
          "$REL/downloader-core" -h >/dev/null
          "$REL/dl" -V
          "$REL/dl" -h >/dev/null
          # Soft-timeout: nmhost --help must not hang (no gtimeout on macOS).
          "$REL/downloader-nmhost" --help >/dev/null &
          pid=$!
          ( sleep 5; kill -TERM "$pid" 2>/dev/null ) &
          w=$!
          wait "$pid"
          kill "$w" 2>/dev/null || true
          wait "$w" 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unix-macos
          path: |
            target/unix/Downloader-*-macos-arm64.tar.gz
            target/unix/Downloader-*-macos-arm64.tar.gz.sha256
            target/unix/Downloader-*-macos-x64.tar.gz
            target/unix/Downloader-*-macos-x64.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag / version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
            VER="${VER%-unix}"
          else
            VER="${{ inputs.version || '0.1.2' }}"
            TAG="v${VER}-unix"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: unix-*
          merge-multiple: true

      - name: List assets
        run: find dist -type f | sort && ls -lh dist/

      - name: Write release notes
        env:
          VER: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES=release-notes-unix.md
          {
            echo "# Downloader ${TAG} (Unix experimental prerelease)"
            echo
            echo "Linux + macOS builds of the segmented download manager."
            echo "**UNSIGNED** — Gatekeeper (macOS) and SmartScreen-equivalents will warn."
            echo "No notarized \`.dmg\` / AppImage in this prerelease."
            echo
            echo "## Assets"
            echo
            echo "| File | Platform |"
            echo "|---|---|"
            echo "| \`Downloader-${VER}-linux-x64.tar.gz\` | Linux x64 (binaries + UI + install script + systemd unit) |"
            echo "| \`Downloader-${VER}-linux-x64.deb\` | Linux x64 Debian package |"
            echo "| \`Downloader-${VER}-macos-arm64.tar.gz\` | macOS Apple Silicon |"
            echo "| \`Downloader-${VER}-macos-x64.tar.gz\` | macOS Intel |"
            echo
            echo "## Install"
            echo
            echo '```'
            echo "tar -xzf Downloader-${VER}-linux-x64.tar.gz"
            echo "cd Downloader-${VER}-linux-x64"
            echo "./install-unix.sh --user"
            echo '```'
            echo
            echo "macOS: same flow; LaunchAgent is installed under \`~/Library/LaunchAgents\`."
            echo "Linux: systemd user unit \`downloader-core.service\` (\`systemctl --user enable --now\`)."
            echo
            echo "Windows MSI remains on the separate \`v${VER}\` release (untouched)."
            echo
            if [[ -f CHANGELOG.txt ]]; then
              echo "## Changelog excerpt"
              echo
              # Prefer [0.1.1] Fixed (Unix...) block; fall back to Unix experimental subsection
              awk -v ver="$VER" '
                $0 ~ ("## \\[" ver "\\]") {p=1; print; next}
                p && /^## \[/ {exit}
                p {print}
              ' CHANGELOG.txt > /tmp/cl-excerpt.txt || true
              if [[ ! -s /tmp/cl-excerpt.txt ]]; then
                awk '
                  /### (Додано|Fixed) \(Unix/ {p=1}
                  p && /^### / && $0 !~ /Unix/ {exit}
                  p && /^## \[/ {exit}
                  p {print}
                ' CHANGELOG.txt > /tmp/cl-excerpt.txt || true
              fi
              cat /tmp/cl-excerpt.txt || true
            fi
          } > "$NOTES"
          cat "$NOTES"

      - name: Create / update GitHub prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=release-notes-unix.md
          TITLE="Downloader v${VER}-unix (Linux + macOS experimental)"
          # Target the release branch when dispatching; for tag pushes gh uses the tag.
          TARGET_ARGS=()
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            TARGET_ARGS+=(--target "${GITHUB_REF_NAME}")
          fi

          ASSETS=(dist/Downloader-*-linux-x64.tar.gz dist/Downloader-*-linux-x64.deb \
                  dist/Downloader-*-macos-arm64.tar.gz dist/Downloader-*-macos-x64.tar.gz)
          # include sha256 if present
          shopt -s nullglob
          EXTRA=(dist/*.sha256)
          shopt -u nullglob

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" "${ASSETS[@]}" ${EXTRA[@]+"${EXTRA[@]}"} --clobber
            gh release edit "$TAG" --prerelease --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              --prerelease \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              "${TARGET_ARGS[@]}" \
              "${ASSETS[@]}" ${EXTRA[@]+"${EXTRA[@]}"}
          fi
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
