name: test

on:
  push:
  pull_request:

jobs:
  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
          components: clippy
      - name: Linux tray deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev pkg-config
      - name: тести
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unix binary smoke (-V / --help)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cargo build -p downloader-cli -p downloader-core-service -p downloader-nmhost
          ./target/debug/dl -V
          ./target/debug/downloader-core -V
          # Soft-timeout for nmhost --help (hang regression guard).
          ./target/debug/downloader-nmhost --help >/dev/null &
          pid=$!
          ( sleep 5; kill -TERM "$pid" 2>/dev/null ) &
          w=$!
          wait "$pid"
          kill "$w" 2>/dev/null || true
          wait "$w" 2>/dev/null || true
