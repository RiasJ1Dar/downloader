name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: windows-latest

    steps:
      - name: Отримати початковий код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Встановити Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Встановити .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Встановити WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix
          $toolsDir = Join-Path $env:USERPROFILE '.dotnet\tools'
          if (Test-Path $toolsDir) {
            Add-Content -Path $env:GITHUB_PATH -Value $toolsDir
          }

      - name: Зібрати пакунки MSI
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Write-Host "Збірка релізу Downloader для теґу: $tag"
          pwsh -File packaging\zibraty.ps1 -Version $tag -ЗавантажитиFfmpeg

      - name: Перевірка зібраних артефактів
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path target\msi -Filter *.msi
          if ($msi.Count -lt 2) {
            throw "Очікувалося щонайменше 2 MSI пакунки, знайдено: $($msi.Count)"
          }
          $sums = Join-Path 'target\msi' 'SHA256SUMS.txt'
          if (-not (Test-Path $sums)) {
            throw "Не знайдено SHA256SUMS.txt"
          }
          Write-Host "Знайдено артефакти:"
          $msi | ForEach-Object { Write-Host " - $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) МБ)" }
          Write-Host "Вміст SHA256SUMS.txt:"
          Get-Content $sums

      - name: Підготувати опис релізу
        id: notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = ($tag -replace '^v', '')
          $notes = ""
          if (Test-Path "CHANGELOG.txt") {
            $raw = Get-Content -Raw "CHANGELOG.txt"
            if ($raw -match "(?ms)^##\s+\[$ver\].*?(?=^##\s+\[|\z)") {
              $notes = $matches[0].Trim()
            } else {
              $notes = $raw.Trim()
            }
          }
          if (-not $notes) {
            $notes = @"
          Downloader $tag

          Зібрано два MSI-пакети для Windows x64:
          - `Downloader-$ver-web.msi` (веб-інсталятор, завантажує ffmpeg за потреби)
          - `Downloader-$ver-full.msi` (повний інсталятор із вбудованим LGPL ffmpeg)

          Контрольні суми SHA-256 наведено у файлі `SHA256SUMS.txt`.
          "@
          }
          $notesFile = "target\msi\release-notes.txt"
          [System.IO.File]::WriteAllText($notesFile, $notes, [System.Text.UTF8Encoding]::new($false))

      - name: Створити чернетку релізу на GitHub
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notesFile = "target\msi\release-notes.txt"
          $webMsi = (Get-ChildItem -Path target\msi -Filter *web.msi).FullName
          $fullMsi = (Get-ChildItem -Path target\msi -Filter *full.msi).FullName
          $sums = (Get-Item target\msi\SHA256SUMS.txt).FullName
          
          Write-Host "Створення чернетки релізу $tag на GitHub..."
          gh release create $tag `
            --draft `
            --title "Downloader $tag" `
            --notes-file $notesFile `
            $webMsi $fullMsi $sums
          Write-Host "Чернетку релізу успішно створено!"
