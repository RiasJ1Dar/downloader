[package]
name = "downloader-ffmpeg"
description = "Пошук ffmpeg і два виклики, яких потребують модулі: зміна контейнера й зведення доріжок"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
downloader-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "macros"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
