[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ipc",
    "crates/proto-http",
    "crates/proto-hls",
    "crates/winutil",
    "crates/testserver",
    "apps/cli",
    "apps/core-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/RiasJ1Dar/downloader"

[workspace.dependencies]
downloader-core = { path = "crates/core" }
downloader-testserver = { path = "crates/testserver" }
downloader-proto-http = { path = "crates/proto-http" }
downloader-proto-hls = { path = "crates/proto-hls" }
downloader-winutil = { path = "crates/winutil" }
downloader-ipc = { path = "crates/ipc" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# мережа рушія
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "socks"] }
bytes = "1"
futures-util = "0.3"
m3u8-rs = "6"
aes = "0.8"
cbc = "0.1"

# перевірка цілісності в тестах
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
