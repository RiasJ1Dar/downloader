[package]
name = "downloader-core-service"
description = "Ядро менеджера завантажень окремим процесом"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "downloader-core"
path = "src/main.rs"

[dependencies]
downloader-core.workspace = true
downloader-ipc.workspace = true
downloader-proto-http.workspace = true
downloader-proto-hls.workspace = true
downloader-proto-dash.workspace = true
downloader-proto-ytdlp.workspace = true
downloader-winutil.workspace = true
downloader-i18n.workspace = true
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Трей на Windows / Linux / macOS. На Linux потрібні системні пакети:
# libgtk-3, libayatana-appindicator3 (або libappindicator3), pkg-config.
# Без DISPLAY трей тихо не піднімається — IPC лишається.
[target.'cfg(any(windows, unix))'.dependencies]
tray-icon = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", default-features = false }

[dev-dependencies]
downloader-testserver.workspace = true
sha2.workspace = true
hex.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
