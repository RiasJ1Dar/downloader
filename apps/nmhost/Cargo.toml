[package]
name = "downloader-nmhost"
description = "Native messaging host: розширення браузера → ядро (без TCP-порту)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "downloader-nmhost"
path = "src/main.rs"

[dependencies]
downloader-ipc.workspace = true
downloader-winutil.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
